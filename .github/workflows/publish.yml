name: Publish (manual)

# 正式发版走 release.yml（changesets）。
# 这里只保留手动兜底：在需要跳过 changesets 直接发布当前代码时使用。

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      - name: Publish @proseharbor-editor/core
        run: yarn workspace @proseharbor-editor/core npm publish --provenance --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @proseharbor-editor/vue3
        run: yarn workspace @proseharbor-editor/vue3 npm publish --provenance --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
